# Regional Job Market Configuration
# Maps countries/regions to keywords for targeted job searches.
# Used by scan-portals.mjs --region and search-region.mjs

regions:
  # ─── UAE (shortcut for UAE-only search) ───
  uae:
    label: "UAE"
    country_codes: ["AE"]
    countries:
      - "UAE"
      - "Dubai"
      - "Abu Dhabi"
      - "Sharjah"
    keywords: "UAE OR Dubai OR Abu Dhabi"
    job_sites:
      - "linkedin.com/jobs"
      - "bayt.com"
      - "naukrigulf.com"
      - "gulftalent.com"
      - "indeed.ae"

